<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="泉森的影像档案：按国家收录风光、建筑、街景与物种。">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<title>影像 · 半亩方塘</title>
<style>
  :root{
    --paper:#f7f4ed;--ink:#201f1b;--ink-2:#5f5b53;--ink-3:#6f685f;
    --line:#d7d0c2;--line-dark:#b9b0a1;--seal:#9b3227;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  a:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","STSong",serif;
    line-height:1.9;letter-spacing:.01em}
  img{display:block;max-width:100%}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px}

  header{display:flex;justify-content:space-between;align-items:center;
    padding:34px 0 24px;border-bottom:1px solid var(--line)}
  .mark{font-size:22px;letter-spacing:.34em;font-weight:500;color:var(--seal);text-decoration:none}
  nav a{display:inline-flex;align-items:center;min-height:44px;font-size:13px;letter-spacing:.16em;margin-left:26px;text-decoration:none;color:var(--ink-2)}
  nav a:hover,nav a[aria-current="page"]{color:var(--ink)}

  .intro{padding:72px 0 58px}
  .intro h1{font-size:clamp(38px,6vw,68px);line-height:1.15;font-weight:500;margin:0 0 22px}
  .intro p{font-size:16px;color:var(--ink-2);line-height:2;margin:0;max-width:32em}

  .country-jump{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line)}
  .country-jump a{display:flex;flex-direction:column;justify-content:center;min-height:78px;padding:13px 18px;
    text-decoration:none;border-left:1px solid var(--line)}
  .country-jump a:first-child{padding-left:0;border-left:0}
  .country-jump span{color:var(--ink-3);font-size:10px;line-height:1.4;letter-spacing:.14em}
  .country-jump strong{margin-top:3px;font-size:16px;line-height:1.4;font-weight:500}
  .country-jump a:hover strong{color:var(--seal)}

  .country{padding:54px 0 64px;border-top:1px solid var(--line);scroll-margin-top:20px}
  .country:first-of-type{border-top:0}
  .country-head{display:grid;grid-template-columns:240px 1fr;gap:48px;align-items:start;margin-bottom:30px}
  .country-year{font-size:12px;letter-spacing:.14em;color:var(--ink-3);margin:0 0 8px}
  .country h2{font-size:38px;line-height:1.2;font-weight:500;margin:0}
  .country-desc{font-size:14px;line-height:1.95;color:var(--ink-2);margin:0;max-width:38em}
  .travel-link{display:inline-block;margin-top:12px;font-size:12px;letter-spacing:.1em;
    color:var(--seal);text-decoration:none;border-bottom:1px solid var(--seal);padding-bottom:2px}
  .travel-link:hover{opacity:.75}

  .gallery{display:grid;grid-template-columns:1.08fr .92fr .92fr;gap:clamp(14px,2.1vw,26px);align-items:start}
  .gallery figure{margin:0}
  .gallery figure:nth-child(2){padding-top:34px}
  .gallery figure:nth-child(3){padding-top:68px}
  .gallery a{display:block;position:relative;overflow:hidden;background:#e9e6df}
  .gallery a::after{content:"";position:absolute;inset:9px;border:1px solid rgba(247,244,237,.5);pointer-events:none}
  .gallery img{width:100%;height:auto;background:#e9e6df;filter:grayscale(.06) saturate(.9);
    transition:filter .35s ease,transform .65s cubic-bezier(.16,1,.3,1)}
  .gallery a:hover img{filter:grayscale(0) saturate(.98);transform:scale(1.012)}
  .gallery figcaption{font-size:13px;line-height:1.7;color:var(--ink-3);margin-top:9px;letter-spacing:.04em}

  footer{border-top:1px solid var(--line);padding:34px 0 60px;
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
  footer a{text-decoration:none;border-bottom:1px solid var(--line)}

  @media (max-width:820px){
    .wrap{padding:0 20px}
    header{align-items:center}
    .mark{font-size:20px;letter-spacing:.26em}
    nav a{min-width:44px;justify-content:center;font-size:12px;margin-left:4px;letter-spacing:.1em}
    .intro{padding:54px 0 42px}
    .intro p{font-size:15px}
    .country-jump{grid-template-columns:repeat(2,minmax(0,1fr))}
    .country-jump a{padding-left:16px}
    .country-jump a:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)}
    .country-jump a:nth-child(4){border-top:1px solid var(--line)}
    .country{padding:42px 0 50px}
    .country-head{grid-template-columns:1fr;gap:12px;margin-bottom:22px}
    .country h2{font-size:34px}
    .gallery{grid-template-columns:1fr}
    .gallery figure:nth-child(2),.gallery figure:nth-child(3){padding-top:0}
    .gallery figure + figure{margin-top:16px}
    footer{flex-direction:column;gap:10px}
  }
</style>

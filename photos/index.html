<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="泉森的影像档案：按国家收录风光、建筑、街景与物种。">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<title>影像档案 · 半亩方塘</title>
<style>
  :root{
    --paper:#fbfaf7;--ink:#1f1f1f;--ink-2:#555;--ink-3:#5f5b54;
    --line:#e3e0d8;--seal:#a63a2c;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
    line-height:1.9;letter-spacing:.01em}
  img{display:block;max-width:100%}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px}

  header{display:flex;justify-content:space-between;align-items:baseline;
    padding:34px 0 18px;border-bottom:1px solid var(--line)}
  .mark{font-size:22px;letter-spacing:.34em;font-weight:500;color:var(--seal);text-decoration:none}
  nav a{font-size:13px;letter-spacing:.16em;margin-left:26px;text-decoration:none;color:var(--ink-2)}
  nav a:hover,nav a[aria-current="page"]{color:var(--seal)}

  .intro{padding:72px 0 58px}
  .intro h1{font-size:clamp(38px,6vw,68px);line-height:1.15;font-weight:500;margin:0 0 22px}
  .intro p{font-size:16px;color:var(--ink-2);line-height:2;margin:0;max-width:32em}

  .country{padding:54px 0 64px;border-top:1px solid var(--line)}
  .country-head{display:grid;grid-template-columns:240px 1fr;gap:48px;align-items:start;margin-bottom:30px}
  .country-year{font-size:12px;letter-spacing:.14em;color:var(--ink-3);margin:0 0 8px}
  .country h2{font-size:38px;line-height:1.2;font-weight:500;margin:0}
  .country-desc{font-size:14px;line-height:1.95;color:var(--ink-2);margin:0;max-width:38em}

  .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
  .gallery figure{margin:0}
  .gallery a{display:block}
  .gallery img{width:100%;background:#e9e6df}
  .gallery img.tall,.gallery img.wide{aspect-ratio:4/5;object-fit:cover}
  .gallery figcaption{font-size:13px;line-height:1.7;color:var(--ink-3);margin-top:9px;letter-spacing:.04em}

  .country-kenya .gallery{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:none}
  .country-kenya .gallery figure:first-child{grid-row:auto}
  .country-kenya .gallery img.tall,.country-kenya .gallery img.wide{aspect-ratio:4/5}

  .country-norway .gallery{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
  .country-norway .gallery img{aspect-ratio:4/5;object-fit:cover}

  footer{border-top:1px solid var(--line);padding:34px 0 60px;
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
  footer a{text-decoration:none;border-bottom:1px solid var(--line)}

  @media (max-width:820px){
    .wrap{padding:0 20px}
    header{align-items:start}
    .mark{font-size:20px;letter-spacing:.26em}
    nav a{font-size:12px;margin-left:12px;letter-spacing:.1em}
    .intro{padding:54px 0 42px}
    .intro p{font-size:15px}
    .country{padding:42px 0 50px}
    .country-head{grid-template-columns:1fr;gap:12px;margin-bottom:22px}
    .country h2{font-size:34px}
    .gallery,.country-kenya .gallery,.country-norway .gallery{grid-template-columns:1fr;grid-template-rows:none}
    .country-kenya .gallery figure:first-child{grid-row:auto}
    .gallery img.tall,.gallery img.wide,
    .country-kenya .gallery img.tall,.country-kenya .gallery img.wide,
    .country-norway .gallery img{aspect-ratio:4/5}
    footer{flex-direction:column;gap:10px}
  }
</style>
<meta name="description" content="泉森的影像档案：按国家收录风光、建筑、街景与物种。">
<meta property="og:site_name" content="半亩方塘">
<meta property="og:type" content="website">
<meta property="og:title" content="影像档案 · 半亩方塘">
<meta property="og:description" content="泉森的影像档案：按国家收录风光、建筑、街景与物种。">
<meta property="og:url" content="https://dqquan.com/photos/">
<meta property="og:image" content="https://dqquan.com/img/photo-3.jpg">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://dqquan.com/photos/">
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="../index.html">半亩方塘</a>
    <nav>
      <a href="../books/index.html">阅读</a>
      <a href="index.html" aria-current="page">记录</a>
      <a href="../index.html#about">关于</a>
    </nav>
  </header>

  <section class="intro">
    <h1>影像档案</h1>
    <p>去过的地方，各自留下一组照片。可以是风光、建筑、街景，也可以只是一只鸟。</p>
  </section>

  <section class="country country-peru">
    <div class="country-head">
      <div>
        <p class="country-year">2026</p>
        <h2>秘鲁</h2>
      </div>
      <p class="country-desc">从太平洋岸到高原湿地，留下三帧关于花、水与岩壁的画面。</p>
    </div>
    <div class="gallery">
      <figure>
        <a href="peru-2026/" target="_blank" rel="noopener">
          <img loading="lazy" class="tall" src="../img/countries/peru-01.jpg" alt="花间的蜂鸟">
        </a>
        <figcaption>紫色花穗上的蜂鸟</figcaption>
      </figure>
      <figure>
        <a href="peru-2026/" target="_blank" rel="noopener">
          <img loading="lazy" class="tall" src="../img/countries/peru-02.jpg" alt="水边的火烈鸟">
        </a>
        <figcaption>浅水中觅食的火烈鸟</figcaption>
      </figure>
      <figure>
        <a href="peru-2026/" target="_blank" rel="noopener">
          <img loading="lazy" class="tall" src="../img/countries/peru-03.jpg" alt="岩壁前的海鸟">
        </a>
        <figcaption>岩壁上的印加燕鸥</figcaption>
      </figure>
    </div>
  </section>

  <section class="country country-colombia">
    <div class="country-head">
      <div>
        <p class="country-year">2019</p>
        <h2>哥伦比亚</h2>
      </div>
      <p class="country-desc">安第斯山把云雾林、花朵和蜂鸟放在同一片山坡上。</p>
    </div>
    <div class="gallery">
      <figure>
        <a href="colombia-2019/" target="_blank" rel="noopener">
          <img loading="lazy" class="wide" src="../img/countries/colombia-01.jpg" alt="蜂鸟停在橙色钟形花前">
        </a>
        <figcaption>蜂鸟停在橙色钟形花前</figcaption>
      </figure>
      <figure>
        <a href="colombia-2019/" target="_blank" rel="noopener">
          <img loading="lazy" class="tall" src="../img/countries/colombia-02.jpg" alt="正面悬停的蜂鸟">
        </a>
        <figcaption>正面悬停的蜂鸟</figcaption>
      </figure>
      <figure>
        <a href="colombia-2019/" target="_blank" rel="noopener">
          <img loading="lazy" class="wide" src="../img/countries/colombia-03.jpg" alt="云雾林中的安第斯冠伞鸟">
        </a>
        <figcaption>云雾林中的安第斯冠伞鸟</figcaption>
      </figure>
    </div>
  </section>

  <section class="country country-kenya">
    <div class="country-head">
      <div>
        <p class="country-year">2017</p>
        <h2>肯尼亚</h2>
      </div>
      <p class="country-desc">草原上的一天，从狮子的脚步开始，在落日和飞鸟里结束。</p>
    </div>
    <div class="gallery">
      <figure>
        <a href="kenya-2017/" target="_blank" rel="noopener">
          <img loading="lazy" class="tall" src="../img/countries/kenya-01.jpg" alt="草原上迎面走来的雄狮">
        </a>
        <figcaption>草原上迎面走来的雄狮</figcaption>
      </figure>
      <figure>
        <a href="kenya-2017/" target="_blank" rel="noopener">
          <img loading="lazy" class="wide" src="../img/countries/kenya-02.jpg" alt="草原落日">
        </a>
        <figcaption>草原落日</figcaption>
      </figure>
      <figure>
        <a href="kenya-2017/" target="_blank" rel="noopener">
          <img loading="lazy" class="wide" src="../img/countries/kenya-03.jpg" alt="掠过水面的火烈鸟">
        </a>
        <figcaption>掠过水面的火烈鸟</figcaption>
      </figure>
    </div>
  </section>

  <section class="country country-norway">
    <div class="country-head">
      <div>
        <p class="country-year">2015</p>
        <h2>挪威</h2>
      </div>
      <p class="country-desc">一条跨海的路，一排临水的木屋，以及天色将暗时的峡湾。</p>
    </div>
    <div class="gallery">
      <figure>
        <a href="norway-2015/" target="_blank" rel="noopener">
          <img loading="lazy" src="../img/countries/norway-01.jpg" alt="大西洋海滨公路">
        </a>
        <figcaption>大西洋海滨公路</figcaption>
      </figure>
      <figure>
        <a href="norway-2015/" target="_blank" rel="noopener">
          <img loading="lazy" src="../img/countries/norway-02.jpg" alt="卑尔根布吕根木屋">
        </a>
        <figcaption>卑尔根布吕根木屋</figcaption>
      </figure>
      <figure>
        <a href="norway-2015/" target="_blank" rel="noopener">
          <img loading="lazy" src="../img/countries/norway-03.jpg" alt="暮色中的峡湾小镇">
        </a>
        <figcaption>暮色中的峡湾小镇</figcaption>
      </figure>
    </div>
  </section>

  <footer>
    <span>泉森 · 半亩方塘</span>
    <span><a href="mailto:quan@dqquan.com">quan@dqquan.com</a></span>
  </footer>
</div>
</body>
</html>

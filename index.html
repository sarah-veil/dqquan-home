<style>
  :root{
    --paper:#fbfaf7;
    --ink:#1f1f1f;
    --ink-2:#555;
    --ink-3:#6e6a62;
    --line:#e3e0d8;
    --seal:#a63a2c;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
    line-height:1.95;letter-spacing:.01em;
  }
  img{display:block;max-width:100%}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px}

  header{display:flex;justify-content:space-between;align-items:baseline;
    padding:34px 0 18px;border-bottom:1px solid var(--line)}
  .mark{font-size:22px;letter-spacing:.34em;font-weight:500;color:var(--seal)}
  .mark small{display:block;font-size:11px;letter-spacing:.3em;color:var(--ink-3);margin-top:6px}
  nav a{font-size:13px;letter-spacing:.2em;margin-left:26px;text-decoration:none;color:var(--ink-2)}
  nav a:hover{color:var(--seal)}

  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;
    padding:78px 0 96px;align-items:center}
  .hero h1{font-size:clamp(30px,4.2vw,52px);line-height:1.24;font-weight:500;margin:0 0 22px}
  .hero p{font-size:16px;color:var(--ink-2);margin:0;max-width:26em}
  .hero figure{margin:0}
  .hero img{aspect-ratio:4/5;object-fit:cover;filter:grayscale(.15)}
  .hero figcaption{font-size:12px;color:var(--ink-3);margin-top:10px;letter-spacing:.06em}

  section{padding:56px 0 8px;border-top:1px solid var(--line)}
  section h2{font-size:13px;letter-spacing:.32em;color:var(--ink-3);font-weight:400;margin:0 0 4px}
  section h2::before{content:"";display:inline-block;width:18px;height:1px;
    background:var(--seal);vertical-align:middle;margin-right:12px}

  ul.latest{list-style:none;padding:0;margin:18px 0 0}
  ul.latest a{display:flex;align-items:baseline;gap:22px;padding:22px 2px;
    text-decoration:none;font-size:20px;line-height:1.5;border-bottom:1px solid var(--line)}
  ul.latest a::after{content:"→";margin-left:auto;font-size:14px;color:var(--ink-3)}
  ul.latest a:hover{color:var(--seal)}
  ul.latest a:hover::after{color:var(--seal)}
  ul.latest span{font-size:12px;color:var(--ink-3);letter-spacing:.12em;min-width:104px;flex:none}

  .more{margin:26px 0 0;font-size:12px;color:var(--ink-3);letter-spacing:.1em}
  .more a{text-decoration:none;border-bottom:1px solid var(--line)}
  .more a:hover{color:var(--seal);border-color:var(--seal)}

  footer{border-top:1px solid var(--line);margin-top:64px;padding:34px 0 60px;
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
  footer a{text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--seal);border-color:var(--seal)}

  @media (max-width:820px){
    .wrap{padding:0 20px}
    .hero{grid-template-columns:1fr;gap:34px;padding:52px 0 64px}
    .hero img{aspect-ratio:16/10}
    .mark{font-size:20px;letter-spacing:.26em}
    nav a{margin-left:12px;letter-spacing:.12em}
    ul.latest a{font-size:18px;gap:14px}
    ul.latest span{min-width:84px}
    footer{flex-direction:column;gap:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">半亩方塘<small>泉森 · SEMI MUTA</small></div>
    <nav><a href="books/">阅读</a><a href="photos/">记录</a><a href="about/">关于</a></nav>
  </header>

  <div class="hero">
    <div>
      <h1>一百部书，<br>一百个夜晚。</h1>
      <p>读过的书，走过的地方。</p>
    </div>
    <figure>
      <img src="img/photo-3.jpg" alt="秘鲁太平洋岸的岩壁与鸟">
      <figcaption>印加燕鸥，秘鲁太平洋岸的岩壁</figcaption>
    </figure>
  </div>

  <section id="latest">

    </ul>
    <p class="more"><a href="books/">全部 31 期目录</a>　·　<a href="photos/">全部国家影像</a></p>
  </section>

  <footer>
    <span><a href="about/">关于这半亩方塘</a></span>
    <span><a href="feed.xml">RSS</a>　·　<a href="mailto:quan@dqquan.com">quan@dqquan.com</a></span>
  </footer>
</div>
</body>
</html>

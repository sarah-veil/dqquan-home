<style>
  :root{--paper:#fbfaf7;--ink:#1f1f1f;--ink-2:#555;--ink-3:#6e6a62;--line:#e3e0d8;--seal:#a63a2c}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
    line-height:1.9;letter-spacing:.01em}
  img{display:block;max-width:100%}
  a{color:inherit}

  /* 顶部：刊名与导航压在封面图上 */
  .top{position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:26px 3.2vw;color:#fff}
  .top .mark{font-size:17px;letter-spacing:.42em;font-weight:500;color:#fff;opacity:.96}
  .top nav a{color:inherit;text-decoration:none;font-size:12px;letter-spacing:.22em;
    margin-left:22px;opacity:.82}
  .top nav a:hover{opacity:1}

  /* 封面 */
  .cover{position:relative;height:74vh;min-height:460px;overflow:hidden;background:#111}
  .cover picture,.cover img{width:100%;height:100%}
  .cover img{object-fit:cover;object-position:center 58%;filter:grayscale(.08) contrast(1.02)}
  .cover::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.10) 34%,rgba(0,0,0,.68) 100%)}
  .cover-text{position:absolute;left:3.2vw;right:3.2vw;bottom:6.5vh;z-index:5;color:#fff;
    text-shadow:0 1px 18px rgba(0,0,0,.45)}
  .cover-text h1{margin:0;font-size:clamp(34px,5.2vw,64px);line-height:1.16;
    font-weight:500;letter-spacing:.02em}
  .cover-text .sub{margin:20px 0 0;font-size:13px;letter-spacing:.18em;opacity:.9}

  /* 本期目录 */
  .index{max-width:1080px;margin:0 auto;padding:64px 3.2vw 0}
  .index h2{font-size:11px;letter-spacing:.4em;color:var(--ink-3);font-weight:400;margin:0 0 26px}
  .index h2::before{content:"";display:inline-block;width:18px;height:1px;
    background:var(--seal);vertical-align:middle;margin-right:12px}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
  .row{display:flex;align-items:baseline;gap:18px;padding:18px 0;border-top:1px solid var(--line);
    text-decoration:none;color:inherit}
  .row span{font-size:11px;letter-spacing:.14em;color:var(--ink-3);min-width:88px;flex:none}
  .row b{font-weight:400;font-size:18px}
  .row::after{content:"→";margin-left:auto;font-size:12px;color:var(--ink-3)}
  .row:hover b{color:var(--seal)}
  .more{grid-column:1/-1;margin-top:26px;font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
  .more a{text-decoration:none;border-bottom:1px solid var(--line)}
  .more a:hover{color:var(--seal);border-color:var(--seal)}

  footer{max-width:1080px;margin:80px auto 0;padding:26px 3.2vw 56px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);letter-spacing:.1em}
  footer a{text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--seal);border-color:var(--seal)}

  @media (max-width:820px){
    .cover{height:66vh;min-height:400px}
    .cover img{object-position:center 55%}
    .cover-text h1{font-size:32px}
    .cover-text .sub{font-size:12px;letter-spacing:.12em}
    .rows{grid-template-columns:1fr;gap:0}
    .top{padding:20px 20px}
    .top .mark{font-size:15px;letter-spacing:.3em}
    .top nav a{margin-left:12px;font-size:11px;letter-spacing:.14em}
    .index{padding:48px 20px 0}
    footer{padding:24px 20px 44px;margin-top:56px;flex-direction:column;gap:8px}
  }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">半亩方塘</div>
    <nav><a href="books/">阅读</a><a href="photos/">记录</a><a href="about/">关于</a></nav>
  </div>

  <section class="cover">
    <picture>
      <source srcset="img/countries/w1600/norway-03.webp" type="image/webp">
      <img src="img/countries/norway-03.jpg" alt="暮色中的峡湾小镇">
    </picture>
    <div class="cover-text">
      <h1>读过的书，<br>走过的地方。</h1>
      <p class="sub">一百部书的札记　·　四个国家的影像</p>
    </div>
  </section>

  <section class="index">
    <h2>本期</h2>
    <div class="rows">
      <a class="row" href="books/031/"><span>第 31 期</span><b>世界最简单的才能发现法</b></a>
      <a class="row" href="photos/peru-2026/"><span>2026 · 秘鲁</span><b>太平洋岸，花与鸟</b></a>
      <p class="more"><a href="books/">全部 31 期目录</a>　·　<a href="photos/">全部国家影像</a>　·　<a href="feed.xml">RSS</a></p>
    </div>
  </section>

  <footer>
    <span><a href="about/">关于这半亩方塘</a></span>
    <span><a href="mailto:quan@dqquan.com">quan@dqquan.com</a></span>
  </footer>
</body>
</html>
